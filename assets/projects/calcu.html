<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aesthetic Scientific Calculator</title>
    <style>
        :root {
            --pink-cherub: #f8a5c2;
            --muted-green: #aab86d; 
            --soft-white: #ffffff;
            --text-gray: #5d5d5d;
            --bg-cream: #f9f7f2;
        }

        body {
            background-color: var(--bg-cream);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            margin: 0;
            padding: 10px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        .calculator {
            background-color: var(--muted-green);
            padding: 25px;
            border-radius: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            border: 5px solid var(--pink-cherub);
            width: 100%;
            max-width: 340px; 
            box-sizing: border-box;
        }

        h2 {
            color: var(--pink-cherub);
            text-align: center;
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px white;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            margin-bottom: 20px;
            text-align: right;
            padding: 15px;
            font-size: 24px;
            color: var(--text-gray);
            box-sizing: border-box;
            outline: none;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 50px;
            border-radius: 15px;
            border: none;
            background-color: var(--soft-white);
            color: var(--text-gray);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 3px 0px rgba(0,0,0,0.05);
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: var(--pink-cherub);
            color: white;
        }

        .scientific {
            background-color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            color: #5d5d5d;
        }

        .equal {
            grid-column: span 2;
            background-color: var(--pink-cherub);
            color: white;
        }

        .clear {
            background-color: #ff8a8a; 
            color: white;
        }
        @media (max-height: 600px) {
            .calculator { padding: 15px; }
            button { height: 40px; }
            #display { height: 50px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="calculator">
        <h2>Calculator♡</h2>
        <input type="text" id="display" readonly placeholder="0">
        
        <div class="buttons">
            <button class="scientific" onclick="appendFunc('sin')">sin</button>
            <button class="scientific" onclick="appendFunc('cos')">cos</button>
            <button class="scientific" onclick="appendFunc('tan')">tan</button>
            <button class="scientific" onclick="append('Math.log10(')">log</button>

            <button class="scientific" onclick="append('Math.PI')">π</button>
            <button class="scientific" onclick="append('**')">xʸ</button>
            <button class="scientific" onclick="appendFunc('sqrt')">√</button>
            <button class="clear" onclick="clearDisplay()">C</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('/')">÷</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('*')">×</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('-')">-</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('(')">(</button>
            <button onclick="append(')')">)</button>

            <button class="operator" onclick="append('+')">+</button>
            <button class="equal" onclick="calculate()">=</button>
            <button class="scientific" onclick="backspace()">⌫</button>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');

        function append(value) {
            display.value += value;
        }

        function appendFunc(func) {
            display.value += func + "(";
        }

        function clearDisplay() {
            display.value = '';
        }

        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                let input = display.value;
                input = input.replace(/sin\(/g, 'Math.sin(Math.PI/180*');
                input = input.replace(/cos\(/g, 'Math.cos(Math.PI/180*');
                input = input.replace(/tan\(/g, 'Math.tan(Math.PI/180*');
                input = input.replace(/sqrt\(/g, 'Math.sqrt(');

                let result = eval(input);
                display.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
            } catch (error) {
                display.value = "Error!";
                setTimeout(clearDisplay, 1500);
            }
        }
    </script>
</body>
</html>
