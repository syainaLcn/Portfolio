<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON BOUNCE FIXED</title>
    <style>
        :root { --neon: #00f2ff; --bg: #05070a; --red: #ff4d4d; }
        body {
            margin: 0; background: var(--bg); color: white;
            font-family: sans-serif; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
        }
        #ui { width: 400px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        #container { position: relative; width: 400px; height: 550px; background: #000; border: 2px solid #222; border-radius: 8px; }
        canvas { display: block; border-radius: 8px; cursor: none; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 8px; z-index: 10;
        }
        button {
            padding: 15px 35px; font-size: 1.2rem; cursor: pointer;
            background: var(--neon); border: none; border-radius: 5px; font-weight: bold;
        }
        #pop-notif {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 2.5rem; font-weight: 900; color: var(--red); display: none; z-index: 5;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>ROUND: <span id="rVal">1</span></div>
        <div style="color: #ffcc00">TIME: <span id="tVal">30</span></div>
        <div>HP: <span id="hVal">3</span></div>
    </div>

    <div id="container">
        <div id="pop-notif">LIFE LOST!</div>

        <div id="mStart" class="overlay">
            <h1>NEON BOUNCE</h1>
            <button onclick="startGame(true)">START GAME</button>
        </div>

        <div id="mRound" class="overlay" style="display:none">
            <h1 style="color: #39ff14">ROUND CLEAR!</h1>
            <button onclick="nextRound()">NEXT ROUND</button>
        </div>

        <div id="mOver" class="overlay" style="display:none">
            <h1 style="color: var(--red)">GAME OVER</h1>
            <button onclick="location.reload()">RESTART</button>
        </div>

        <canvas id="canvas" width="400" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const rTxt = document.getElementById('rVal'), hTxt = document.getElementById('hVal'), tTxt = document.getElementById('tVal');
        const notif = document.getElementById('pop-notif');

        let ball = { x: 200, y: 300, vx: 2, vy: 2, r: 8 };
        let paddle = { x: 150, y: 510, w: 100, h: 12 };
        let bubbles = [];
        let round = 1, hp = 3, timeLeft = 30, active = false;
        let timer = 0;

        function setupLevel(full = false) {
            if (full) {
                let bCount = 1 + Math.floor(round / 2);
                let bSize = Math.max(25 - (round * 2), 10);
                bubbles = [];
                for(let i=0; i<bCount; i++) {
                    bubbles.push({
                        x: Math.random() * 300 + 50,
                        y: Math.random() * 150 + 50,
                        r: bSize,
                        vx: (Math.random() - 0.5) * (2 + round)
                    });
                }
                timeLeft = Math.max(35 - (round * 2), 10);
            }
            
            ball.x = 200; ball.y = 350;
            ball.vx = (Math.random() - 0.5) * 6; ball.vy = 3;
            
            let pW = Math.max(130 - (round * 15), 45);
            paddle.w = pW; paddle.x = 200 - pW/2;
            
            rTxt.innerText = round; hTxt.innerText = hp; tTxt.innerText = timeLeft;
        }

        function startGame(first) {
            document.getElementById('mStart').style.display = 'none';
            if(first) { round = 1; hp = 3; }
            setupLevel(true);
            active = true;
        }

        function nextRound() {
            document.getElementById('mRound').style.display = 'none';
            round++;
            setupLevel(true);
            active = true;
        }

        function die(msg) {
            active = false;
            hp--; hTxt.innerText = hp;
            if(hp <= 0) {
                document.getElementById('mOver').style.display = 'flex';
            } else {
                notif.innerText = msg;
                notif.style.display = 'block';
                setTimeout(() => {
                    notif.style.display = 'none';
                    setupLevel(false); 
                    active = true;
                }, 1200);
            }
        }

        canvas.onmousemove = (e) => {
            let rect = canvas.getBoundingClientRect();
            paddle.x = (e.clientX - rect.left) - paddle.w/2;
            paddle.x = Math.max(0, Math.min(400 - paddle.w, paddle.x));
        };

        function loop(ts) {
            if (active) {
                if (!timer) timer = ts;
                if (ts - timer >= 1000) {
                    timeLeft--; tTxt.innerText = timeLeft;
                    timer = ts;
                    if (timeLeft <= 0) die("TIME'S UP!");
                }

                ball.x += ball.vx; ball.y += ball.vy; ball.vy += 0.25;
                if(ball.x < ball.r || ball.x > 400 - ball.r) ball.vx *= -1;
                if(ball.y < ball.r) ball.vy *= -1;

                if(ball.y + ball.r > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.vy > 0) {
                    ball.vy = -15; ball.vx = (ball.x - (paddle.x + paddle.w/2)) / 5;
                }

                for(let i = bubbles.length - 1; i >= 0; i--) {
                    let b = bubbles[i];
                    b.x += b.vx;
                    if(b.x < b.r || b.x > 400 - b.r) b.vx *= -1;
                    if(Math.hypot(ball.x - b.x, ball.y - b.y) < ball.r + b.r) {
                        bubbles.splice(i, 1);
                        if(bubbles.length === 0) {
                            active = false;
                            document.getElementById('mRound').style.display = 'flex';
                        }
                    }
                }
                if(ball.y > 550) die("LIFE LOST!");
            }

            ctx.fillStyle = 'black'; ctx.fillRect(0, 0, 400, 550);
            bubbles.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.strokeStyle = '#00f2ff'; ctx.lineWidth = 3; ctx.stroke();
            });
            ctx.fillStyle = '#00f2ff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fillStyle = 'white'; ctx.fill();

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
