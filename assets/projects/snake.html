<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE</title>
    <style>
        /* Modern Design Setup */
        :root {
            --accent: #00f2ff;
            --danger: #ff0055;
            --bg-dark: #0a0e14;
            --panel: #161b22;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Stats Bar */
        .stats-container {
            display: flex;
            gap: 40px;
            background: var(--panel);
            padding: 15px 40px;
            border-radius: 50px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 2px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; display: block; color: var(--accent); }

        /* Game Board */
        .game-wrapper {
            position: relative;
            border: 8px solid var(--panel);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 242, 255, 0.1);
        }

        canvas {
            display: block;
            background: #000;
            border-radius: 5px;
        }

        /* Overlay / Game Over Screen */
        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 20, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        h2 { font-size: 3rem; margin: 0; color: var(--danger); text-shadow: 0 0 20px var(--danger); }

        /* Modern Button */
        .play-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .play-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--accent);
            background: #fff;
        }

        .hint { margin-top: 15px; color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="stat-item">
            <span class="stat-label">Current Score</span>
            <span id="score" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Best Record</span>
            <span id="best" class="stat-value">0</span>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="screen-overlay">
            <h2>GAME OVER</h2>
            <p id="final-score-msg" style="color: #fff; font-size: 1.2rem;"></p>
            <button class="play-btn" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <p class="hint">Use <b>WASD</b> or <b>Arrow Keys</b> to Move</p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const overlay = document.getElementById("screen-overlay");
        
        const box = 20;
        let score = 0;
        let best = localStorage.getItem("snakeBest") || 0;
        bestEl.innerText = best;

        let snake, food, d, game;

        function init() {
            snake = [{x: 10 * box, y: 10 * box}, {x: 9 * box, y: 10 * box}];
            spawnFood();
            d = "RIGHT";
            score = 0;
            scoreEl.innerText = score;
            overlay.style.display = "none";
            if (game) clearInterval(game);
            game = setInterval(draw, 100);
        }

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * 19 + 1) * box - box,
                y: Math.floor(Math.random() * 19 + 1) * box - box
            };
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key.toLowerCase();
            if ((key == "arrowleft" || key == "a") && d != "RIGHT") d = "LEFT";
            else if ((key == "arrowup" || key == "w") && d != "DOWN") d = "UP";
            else if ((key == "arrowright" || key == "d") && d != "LEFT") d = "RIGHT";
            else if ((key == "arrowdown" || key == "s") && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Food (Glow effect)
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillRect(food.x + 2, food.y + 2, box - 4, box - 4);
            ctx.shadowBlur = 0;

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i == 0) ? "#00f2ff" : "#007a80";
                ctx.fillRect(snake[i].x, snake[i].y, box - 1, box - 1);
            }

            let headX = snake[0].x;
            let headY = snake[0].y;

            if (d == "LEFT") headX -= box;
            if (d == "UP") headY -= box;
            if (d == "RIGHT") headX += box;
            if (d == "DOWN") headY += box;

            // Collision check
            let newHead = { x: headX, y: headY };
            if (headX < 0 || headX >= canvas.width || headY < 0 || headY >= canvas.height || collision(newHead, snake)) {
                gameOver();
                return;
            }

            if (headX == food.x && headY == food.y) {
                score++;
                scoreEl.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function gameOver() {
            clearInterval(game);
            if (score > best) {
                best = score;
                localStorage.setItem("snakeBest", best);
                bestEl.innerText = best;
            }
            document.getElementById("final-score-msg").innerText = "You scored " + score + " points!";
            overlay.style.display = "flex";
        }

        function resetGame() { init(); }

        init();
    </script>
</body>
</html>
