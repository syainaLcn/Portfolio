<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virus Hunter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05010a;
            --panel: #161b22;
            --hole: #000000;
            --accent: #39ff14;
            --enemy: #ff0055;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }

        .header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--accent); margin: 0; font-size: 1.8rem; text-transform: uppercase; }
        
        .stats { 
            display: flex; 
            gap: 20px; 
            font-size: 1.1rem; 
            margin-top: 10px;
            background: var(--panel);
            padding: 8px 20px;
            border-radius: 50px;
        }
        b { color: var(--accent); }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: var(--panel);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #30363d;
            position: relative;
        }

        .node {
            width: 95px;
            height: 95px;
            background: var(--hole);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }

        .virus {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--enemy);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            transition: top 0.1s;
            cursor: pointer;
            color: white;
        }

        .virus.active { top: 0; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 15px;
        }

        .btn {
            background: var(--accent);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }

        .btn:hover { background: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Virus Hunter</h1>
        <div class="stats">
            <span>Score: <b id="score">0</b></span>
            <span>Best: <b id="best">0</b></span>
            <span>Time: <b id="timer">15</b>s</span>
        </div>
    </div>

    <div class="game-grid">
        <div id="overlay">
            <h2 id="msg" style="color: var(--accent); margin: 0;">TIME'S UP!</h2>
            <p style="font-size: 1.2rem; margin: 10px 0;">Final Score: <span id="final">0</span></p>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>

        <div class="node"><div class="virus"><i class="fa-solid fa-bug"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-virus"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-skull"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-ghost"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-biohazard"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-radiation"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-spider"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-bomb"></i></div></div>
        <div class="node"><div class="virus"><i class="fa-solid fa-bolt"></i></div></div>
    </div>

    <button id="start-btn" class="btn" onclick="startGame()" style="margin-top: 20px;">Start Game</button>

    <script>
        const viruses = document.querySelectorAll('.virus');
        const scoreDisplay = document.getElementById('score');
        const bestDisplay = document.getElementById('best');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const finalScore = document.getElementById('final');

        let score = 0;
        let timeLeft = 15;
        let timeUp = false;
        let lastVirus;
        let countdown;

        let best = localStorage.getItem('virusHunterBest') || 0;
        bestDisplay.textContent = best;

        function getRandomVirus() {
            const idx = Math.floor(Math.random() * viruses.length);
            const virus = viruses[idx];
            if (virus === lastVirus) return getRandomVirus();
            lastVirus = virus;
            return virus;
        }

        function peep() {
            if (timeUp) return;
            const time = Math.random() * (600 - 300) + 300;
            const virus = getRandomVirus();
            virus.classList.add('active');
            
            setTimeout(() => {
                virus.classList.remove('active');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            score = 0;
            timeLeft = 15;
            timeUp = false;
            scoreDisplay.textContent = 0;
            timerDisplay.textContent = timeLeft;
            overlay.style.display = 'none';
            startBtn.style.visibility = 'hidden';

            peep();
            
            countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            timeUp = true;
            finalScore.textContent = score;
            overlay.style.display = 'flex';
            startBtn.style.visibility = 'visible';
            
            if (score > best) {
                best = score;
                localStorage.setItem('virusHunterBest', best);
                bestDisplay.textContent = best;
                document.getElementById('msg').textContent = "NEW BEST SCORE!";
            } else {
                document.getElementById('msg').textContent = "TIME'S UP!";
            }
        }

        viruses.forEach(v => v.addEventListener('mousedown', function() {
            if (!this.classList.contains('active') || timeUp) return;
            score++;
            this.classList.remove('active');
            scoreDisplay.textContent = score;
        }));
    </script>
</body>
</html>
