<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --danger: #ef4444;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 15%, 0.5) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(200, 100%, 10%, 0.5) 0, transparent 50%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .round-info h1 {
            font-size: 1.5rem;
            margin: 0;
            background: linear-gradient(to right, #7dd3fc, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .best-score {
            font-size: 0.8rem;
            opacity: 0.7;
            background: var(--glass-border);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .grid {
            display: grid;
            gap: 10px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1/1;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.flipped { transform: rotateY(180deg); }

        .card div {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .card .front {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--accent);
            font-size: 1.5rem;
        }

        .card .back {
            background: var(--accent);
            color: white;
            transform: rotateY(180deg);
            font-size: 1.8rem;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .footer {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
        }

        .stat-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; display: block; }
        .stat-value { font-size: 1.2rem; font-weight: 700; display: block; }
        #moves { color: var(--danger); }
        #matches { color: #10b981; }

        #message-box {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 24px;
            padding: 20px;
        }

        #msg-title { font-size: 2rem; margin: 0; font-weight: 900; }
        #msg-body { margin: 10px 0 25px; opacity: 0.8; }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="round-info">
                <h1 id="round-txt">ROUND 1</h1>
            </div>
            <div class="best-score">
                BEST: <b id="best">0</b>
            </div>
        </div>
        
        <div id="grid" class="grid"></div>

        <div class="footer">
            <div class="stat-card">
                <span class="stat-label">Moves Left</span>
                <span id="moves" class="stat-value">20</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Progress</span>
                <span id="matches" class="stat-value">0/8</span>
            </div>
        </div>

        <div id="message-box">
            <h2 id="msg-title">TITLE</h2>
            <p id="msg-body">Description</p>
            <button id="next-btn" class="btn" onclick="handleBtnClick()">Continue</button>
        </div>
    </div>

    <script>
        const icons = ['fa-anchor', 'fa-fish', 'fa-bolt', 'fa-ghost', 'fa-heart', 'fa-star', 'fa-leaf', 'fa-fire', 'fa-dragon', 'fa-gem', 'fa-cloud', 'fa-moon', 'fa-sun', 'fa-eye', 'fa-skull', 'fa-tree', 'fa-lemon', 'fa-bomb'];
        
        let round = 1;
        let flippedCards = [];
        let matchedCount = 0;
        let movesLeft = 20;
        let canFlip = true;
        let totalPairs = 8;
        let isGameOver = false;

        let best = localStorage.getItem('memBestElite') || 0;
        document.getElementById('best').innerText = best;

        function initGame() {
            const grid = document.getElementById('grid');
            const msgBox = document.getElementById('message-box');
            msgBox.style.display = 'none';
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            canFlip = true;
            isGameOver = false;

            let cols = 4;
            // ROUND CONFIG: Starts at 20 Moves
            if(round === 1) { totalPairs = 8; movesLeft = 20; cols = 4; }
            else if(round === 2) { totalPairs = 10; movesLeft = 25; cols = 5; }
            else if(round === 3) { totalPairs = 12; movesLeft = 30; cols = 6; }
            else { totalPairs = 15; movesLeft = 35; cols = 6; }

            document.getElementById('round-txt').innerText = `ROUND ${round}`;
            document.getElementById('moves').innerText = movesLeft;
            document.getElementById('matches').innerText = `0/${totalPairs}`;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            let cardWidth = round >= 3 ? '60px' : '75px';
            if(window.innerWidth < 500) cardWidth = round >= 3 ? '45px' : '60px';

            let roundIcons = icons.slice(0, totalPairs);
            let deck = [...roundIcons, ...roundIcons].sort(() => Math.random() - 0.5);

            deck.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.width = cardWidth;
                card.dataset.icon = icon;
                card.innerHTML = `
                    <div class="front"><i class="fa-solid fa-water"></i></div>
                    <div class="back"><i class="fa-solid ${icon}"></i></div>
                `;
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if(!canFlip || card.classList.contains('flipped') || flippedCards.includes(card)) return;
            card.classList.add('flipped');
            flippedCards.push(card);
            if(flippedCards.length === 2) checkMatch();
        }

        function checkMatch() {
            canFlip = false;
            const [c1, c2] = flippedCards;
            if(c1.dataset.icon === c2.dataset.icon) {
                matchedCount++;
                document.getElementById('matches').innerText = `${matchedCount}/${totalPairs}`;
                flippedCards = [];
                canFlip = true;
                if(matchedCount === totalPairs) showEnd(true);
            } else {
                movesLeft--;
                document.getElementById('moves').innerText = movesLeft;
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                    if(movesLeft <= 0) showEnd(false);
                    else canFlip = true;
                }, 700);
            }
        }

        function showEnd(win) {
            const msgBox = document.getElementById('message-box');
            const title = document.getElementById('msg-title');
            const body = document.getElementById('msg-body');
            const btn = document.getElementById('next-btn');
            
            if(win) {
                title.innerText = "EXCELLENT!";
                title.style.color = "#0ea5e9";
                body.innerText = `Cleared with ${movesLeft} moves remaining.`;
                btn.innerText = "NEXT ROUND";
                isGameOver = false;
                if(movesLeft > best) {
                    best = movesLeft;
                    localStorage.setItem('memBestElite', best);
                    document.getElementById('best').innerText = best;
                }
            } else {
                title.innerText = "DEFEAT";
                title.style.color = "#ef4444";
                body.innerText = "You ran out of energy.";
                btn.innerText = "RESTART GAME";
                isGameOver = true;
            }
            setTimeout(() => { msgBox.style.display = 'flex'; }, 500);
        }

        function handleBtnClick() {
            if(isGameOver) round = 1; else round++;
            initGame();
        }

        initGame();
    </script>
</body>
</html>
